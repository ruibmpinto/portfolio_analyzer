[package]
name = "dashboard"
version = "1.0.0"
description = "Portfolio analytics dashboard (Tauri shell)"
authors = ["RBMP"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1.5", features = ["shell-sidecar", "process-command-api"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
